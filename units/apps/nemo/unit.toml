name     = "nemo"
layer    = "apps"
summary  = "Nemo file manager"
default  = false

[packages]
dnf = ["nemo", "nemo-fileroller"]

# Adwaita ships these only as 16 px PNGs, blurred when Nemo draws them
# larger. Its index.theme already lists scalable/emblems, and GTK reads
# that folder from every icon path, so this one joins the system theme.
[links]
"config/nemo/emblems" = "~/.local/share/icons/Adwaita/scalable/emblems"

[[hooks]]
name   = "file-manager"
run_as = "user"
does   = "Nemo as the inode/directory handler, org.freedesktop.FileManager1 D-Bus redirect, thumbnail limit 32 MiB, sidebar width, menubar and status bar hidden, a terminal that exists for Open in Terminal"
from   = "config/nemo/install.sh"
run    = "units/apps/nemo/hooks/file-manager.sh"
