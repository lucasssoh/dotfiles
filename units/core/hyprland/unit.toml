name     = "hyprland"
layer    = "core"
summary  = "Hyprland and its ecosystem, the Lua config, session scripts, host profiles, wallpapers"
requires = ["base", "fonts", "theme"]

[packages]
dnf = [
  "hyprland", "hyprlock", "hypridle", "hyprsunset", "hyprland-guiutils",
  "xdg-desktop-portal-hyprland", "xdg-desktop-portal-gtk",
  "dbus-x11", "dbus-daemon", "dbus-tools", "polkit", "xdg-user-dirs",
  "awww", "wlopm", "brightnessctl", "power-profiles-daemon", "lm_sensors",
  "jq", "bc", "socat", "curl", "git", "unzip", "inotify-tools", "libnotify",
  "python3-numpy", "python3-pillow",
]
copr = ["lionheartp/Hyprland"]

[links]
"config/hyprland/hypr"    = "~/.config/hypr"
"config/hyprland/scripts" = "~/.config/scripts"
"config/hyprland/systemd/wallpaper-slideshow.service"         = "~/.config/systemd/user/wallpaper-slideshow.service"
"config/hyprland/systemd/slideshow-fullscreen-guard.service"  = "~/.config/systemd/user/slideshow-fullscreen-guard.service"
"config/nemo/hyprland-portals.conf" = "~/.config/xdg-desktop-portal/hyprland-portals.conf"

[services]
user = ["wallpaper-slideshow", "slideshow-fullscreen-guard"]

[[hooks]]
name   = "sensors-detect"
run_as = "root"
does   = "sensors-detect --auto"
from   = "config/hyprland/install.sh"
run    = "units/core/hyprland/hooks/sensors-detect.sh"

[[hooks]]
name   = "wallpapers"
run_as = "user"
does   = "merge wallpapers/ (and the folders in prisme/wallpapers-extra.conf) into ~/Images/Wallpapers"
from   = "config/hyprland/set_wallpapers.sh, config/hyprland/install.sh"
run    = "units/core/hyprland/hooks/wallpapers.sh"
watch  = ["config/hyprland/set_wallpapers.sh", "wallpapers"]
