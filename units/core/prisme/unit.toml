name     = "prisme"
layer    = "core"
summary  = "Wallpaper picker, and wallpaper-filter to fit wallpapers to each screen"
requires = ["hyprland"]

# stable: the RPM from the COPR, same version as the release.
# edge:   built locally from config/hyprland/prisme-src with the build deps.
[binaries]
rpm    = "prisme"
source = "config/hyprland/prisme-src"
bins   = ["prisme", "wallpaper-filter"]

[packages]
dnf   = [
]
build = ["rust", "cargo", "gtk4-devel", "gtk4-layer-shell-devel"]

[links]
"config/hyprland/prisme" = "~/.config/prisme"
