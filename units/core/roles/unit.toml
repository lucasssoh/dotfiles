name     = "roles"
layer    = "core"
summary  = "Terminal, browser and file-manager roles behind Super+Enter, Super+B, Super+E"
requires = ["hyprland"]

# The launcher itself, config/hyprland/hypr/scripts/coucou-open, ships with
# the hyprland unit's hypr/ link; this unit brings what it resolves roles with.
[packages]
dnf = ["xdg-terminal-exec"]
