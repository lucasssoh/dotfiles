name     = "bar"
layer    = "core"
summary  = "The Quickshell bar: drawers, notifications, Veille, calendar; screenshot and clipboard tools; fontview"
requires = ["hyprland", "fonts", "audio", "balise", "manette", "sesame", "fuzzel"]

[packages]
dnf = [
  "quickshell", "qt6-qt5compat",
  "khal", "upower", "playerctl", "pavucontrol", "pulseaudio-utils",
  "wl-clipboard", "cliphist",
  "grim", "slurp", "grimblast", "satty",
  "v4l-utils",  # review: which part of the bar uses it?
]
copr = ["errornointernet/quickshell", "mineiro/satty"]

[links]
"config/hyprland/quickshell" = "~/.config/quickshell"
"config/hyprland/khal"       = "~/.config/khal"
"config/hyprland/quickshell/fontview/fontview" = "~/.local/bin/fontview"

[[hooks]]
name   = "fontview-mime"
run_as = "user"
does   = "write fontview.desktop and make fontview the handler of font files"
run    = "units/core/bar/hooks/fontview-mime.sh"

[[hooks]]
name   = "khal-calendars"
run_as = "user"
does   = "create the folders of khal's calendars, so khal never meets a missing one"
run    = "units/core/bar/hooks/khal-calendars.sh"
watch  = ["config/hyprland/khal"]
