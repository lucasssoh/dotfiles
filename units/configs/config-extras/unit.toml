name     = "config-extras"
layer    = "configs"
summary  = "Lucas's configs for mpv, MangoHud, fastfetch, Brave and lazygit, each file only when its app is installed; a launcher for CPLEX Studio's OPL IDE, hidden while it is not in /opt"

[links]
"config/mpv/mpv.conf"             = "~/.config/mpv/mpv.conf"
"config/mangohud/MangoHud.conf"   = "~/.config/MangoHud/MangoHud.conf"
"config/fastfetch/config.jsonc"   = "~/.config/fastfetch/config.jsonc"
"config/fastfetch/rayponce.png"   = "~/.config/fastfetch/rayponce.png"
"config/oplide/oplide.desktop"    = "~/.local/share/applications/oplide.desktop"
"config/lazygit/config.yml"       = "~/.config/lazygit/config.yml"

[links_if]
mpv       = ["config/mpv/mpv.conf"]
mangohud  = ["config/mangohud/MangoHud.conf"]
fastfetch = ["config/fastfetch/config.jsonc", "config/fastfetch/rayponce.png"]

[[hooks]]
name   = "brave-flags"
run_as = "user"
does   = "when brave is installed: user .desktop override adding config/brave/brave-flags.conf to every Exec= line"
from   = "config/brave/install.sh"
run    = "units/configs/config-extras/hooks/brave-flags.sh"
watch  = ["config/brave/brave-flags.conf"]
