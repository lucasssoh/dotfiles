name: Release

# A vX.Y.Z tag: build and sign the RPMs, attach them to a GitHub release
# titled from CHANGELOG.md, then republish Pages so the dnf repository
# carries them.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # One build per Fedora release the dnf repository serves: each RPM carries
  # its .fcN, which is how make-repo.sh files it under fedora/N/.
  rpms:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fedora: [44, 45]
    container: fedora:${{ matrix.fedora }}
    steps:
      - name: Build dependencies
        run: >
          dnf -y install git-core rpm-build rpm-sign gnupg2 curl
          cargo rust gcc 'pkgconfig(gtk4)' 'pkgconfig(gtk4-layer-shell-0)'
          'pkgconfig(libadwaita-1)' 'pkgconfig(epoxy)' 'pkgconfig(fontconfig)'

      - uses: actions/checkout@v7

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/build-rpms.sh "$GITHUB_REF_NAME" out

      - name: Sign
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
        run: |
          printf '%s\n' "$RPM_SIGNING_KEY" | gpg --batch --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          rpmsign --addsign --define "_gpg_name $key" out/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: rpms-fc${{ matrix.fedora }}
          path: out/*.rpm

  # Once every build is signed: one release with all of them.
  release:
    needs: rpms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: rpms-fc*
          path: out
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "## 1.1.0 « Name »", or "## 1.0.1" for a release without a name.
          name="$(grep -m1 "^## ${GITHUB_REF_NAME#v} « " CHANGELOG.md | sed 's/^## [^ ]* « \(.*\) »$/\1/' || true)"
          title="$GITHUB_REF_NAME${name:+ « $name »}"
          packaging/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" out/*.rpm \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes-file notes.md

  pages:
    needs: release
    uses: ./.github/workflows/site.yml
    secrets: inherit
