name: Bug
description: Something doesn't work as the documentation says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Super + W
        2. …
  - type: textarea
    id: version
    attributes:
      label: Output of `cc-pkg-mng --version`
      render: text
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Machine
      placeholder: Lenovo IdeaPad Slim 5, Intel
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The error message, or the part of `journalctl --user -b` around it.
      render: text
