# The documentation's screenshots, retaken by scripts/pellicule.
#
# Each scene runs its steps on an empty workspace, in demo mode, then takes
# the screen, crops it to `crop` ([x, y, width, height] on the 1920x1200
# frame, or "full"; on another screen or scale the crop follows the edges it
# touches, see scripts/pellicule) and saves NAME.webp (light) and NAME-dark.webp here.
# `after` steps run once the screenshot is taken. The windows and programs
# a scene opens are closed before the next one.
#
# Steps: ipc TARGET FUNCTION [ARGS...] · wait SECONDS · run COMMAND... ·
#        close CLASS [last] · key KEY (typed into the app in front) ·
#        scheme light|dark · notify APP | SUMMARY | BODY [| OPTIONS]
# A notify step's OPTIONS: entry=DESKTOP_ID (the app's icon) icon=NAME
# image=PATH urgency=low|normal|critical.
#
# After changing an IpcHandler, or a command a scene runs:
#     scripts/pellicule check

[settings]
workspace = 9
size = [1920, 1200]
# A light/dark pair: either name stands for both.
wallpaper = "coucou-aube-plis.jxl"
quality = 85
# Seconds for the wallpaper and the apps to follow a colour scheme change.
scheme_wait = 3
# Where the pointer waits during a take, clear of every scene: under it a
# pop-up lightens and holds its timer.
pointer = [960, 1100]

[[scene]]
name = "bar"
doc = "docs/bar/index.md"
crop = "full"
steps = ["wait 0.5"]

[[scene]]
name = "work"
doc = "README.md"
crop = "full"
# Neovim keeps dark colours on the see-through terminal: in light mode its
# text can't be read.
modes = ["dark"]
# Nemo and Liseuse on the left, Neovim on the right. The key bindings open
# in zathura as Liseuse shows Markdown (rendered dark, so no recolor), with
# a data folder of its own: Liseuse itself would log a reading session.
steps = [
    "run nemo {repo}/wallpapers",
    "wait 2",
    "run wezterm start --class pellicule-editor --cwd {repo} -- nvim +250 +'normal! zt' config/hyprland/quickshell/bar/modules/controller/ControllerPopup.qml",
    "wait 2.5",
    "run hyprctl eval 'hl.dispatch(hl.dsp.focus({ direction = \"left\" }))'",
    "wait 0.3",
    "run sh -c 'c=~/.cache/pellicule/zathura; mkdir -p $c && { cat {repo}/config/liseuse/zathurarc; echo set recolor false; } > $c/zathurarc && exec zathura --config-dir $c --data-dir $c -P 4 \"$(python3 {repo}/config/liseuse/md2pdf.py {repo}/docs/keybindings.md ~/.cache/pellicule/md)\"'",
    "wait 3",
]

[[scene]]
name = "balise"
doc = "docs/bar/balise.md"
crop = [1120, 0, 800, 500]
steps = ["ipc bar toggleBalise", "wait 1.4"]
after = ["ipc bar toggleBalise", "wait 0.8"]

[[scene]]
name = "mixer"
doc = "docs/bar/mixer.md"
crop = [960, 0, 960, 600]
steps = ["ipc bar toggleMixer", "wait 1.4"]
after = ["ipc bar toggleMixer", "wait 0.8"]

[[scene]]
name = "power"
doc = "docs/bar/power.md"
crop = [880, 0, 1040, 650]
steps = ["ipc bar togglePower", "wait 1.4"]
after = ["ipc bar togglePower", "wait 0.8"]

[[scene]]
name = "calendar"
doc = "docs/bar/clock-agenda.md"
crop = [0, 0, 800, 500]
steps = ["ipc bar toggleCalendar", "wait 1.4"]
after = ["ipc bar toggleCalendar", "wait 0.8"]

[[scene]]
name = "notifications"
doc = "docs/bar/notifications.md"
crop = [1280, 0, 640, 1000]
# Two from Prisme in a row show the sender once; the screenshot shows in
# full. The centre opens past 1.5 s, once the lines no longer slide in;
# the pop-ups still up on the left are outside the crop.
steps = [
    "notify cc-pkg-mng | Up to date | coucou-shell 2.4.0 on the stable channel",
    "notify Liseuse | Resuming | Plus courts chemins, page 12 of 48",
    "notify Prisme | Wallpapers ready | 3 fitted for 1920x1200",
    "notify Prisme | Wallpapers ready | 2 fitted for 2560x1440",
    "notify Screenshot | Screenshot saved | Pictures/Screenshots/work.png | entry=io.github.lucasssoh.Screenshot image={repo}/docs/screenshots/work-dark.webp",
    "wait 1.8",
    "ipc bar toggleNotificationCenter",
    "wait 1.4",
]
after = ["ipc bar closeNotificationCenter", "wait 0.8"]

[[scene]]
name = "toasts"
doc = "docs/bar/notifications.md"
crop = [0, 250, 640, 700]
# The same five as pop-ups: the screenshot on top, the two from Prisme in
# one pop-up, Liseuse, and cc-pkg-mng waiting underneath. They come in one
# by one, 110 ms apart, each text 60 ms behind its card: all settled by 1.4 s.
steps = [
    "notify cc-pkg-mng | Up to date | coucou-shell 2.4.0 on the stable channel",
    "notify Liseuse | Resuming | Plus courts chemins, page 12 of 48",
    "notify Prisme | Wallpapers ready | 3 fitted for 1920x1200",
    "notify Prisme | Wallpapers ready | 2 fitted for 2560x1440",
    "notify Screenshot | Screenshot saved | Pictures/Screenshots/work.png | entry=io.github.lucasssoh.Screenshot image={repo}/docs/screenshots/work-dark.webp",
    "wait 1.4",
]

[[scene]]
name = "battery-alert"
doc = "docs/bar/power.md"
crop = [640, 400, 640, 400]
steps = ["ipc bar simulateBattery 8", "wait 1.5"]
after = ["ipc bar dismissBattery", "wait 0.8"]

[[scene]]
name = "osd"
doc = "docs/bar/indicators.md"
crop = [720, 800, 480, 400]
steps = ["ipc bar pokeBrightness", "wait 0.35"]
after = ["wait 2"]

[[scene]]
name = "veille"
doc = "docs/bar/veille.md"
crop = [480, 0, 960, 600]
# On the hour, Veille shows itself; frozen, it stays.
steps = ["ipc clock freeze 02:00:00", "wait 2.5"]
after = ["ipc clock freeze 10:42:00", "wait 1.5"]

[[scene]]
name = "keybinds"
doc = "docs/keybindings.md"
crop = "full"
steps = ["ipc bar keybindsPress", "wait 1.5"]

[[scene]]
name = "keybinds-shift"
doc = "docs/keybindings.md"
crop = "full"
steps = ["ipc bar keybindsShift true", "wait 0.8"]
after = ["ipc bar keybindsShift false", "ipc bar keybindsRelease", "wait 1"]

[[scene]]
name = "launcher"
doc = "docs/tools/launcher.md"
crop = [640, 400, 640, 400]
steps = ["run fuzzel", "wait 1.2"]

[[scene]]
name = "roue"
doc = "docs/tools/roue.md"
crop = [480, 300, 960, 600]
steps = ["run ~/.local/bin/roue power", "wait 1.5"]

[[scene]]
name = "sesame"
doc = "docs/tools/sesame.md"
crop = [480, 240, 960, 720]
# A made-up request: answering it sends nothing.
steps = ["ipc bar sesameDemo polkit", "wait 1.5"]
after = ["ipc bar sesameCancel", "wait 0.8"]

[[scene]]
name = "prisme"
doc = "docs/tools/prisme.md"
crop = "full"
steps = ["run ~/.local/bin/prisme", "wait 4"]

# ---- Antenne ----------------------------------------------------------------
# Antenne is dark in both colour schemes, so only the dark take is kept. Each
# scene starts it in a sandbox of its own (antenne-sandbox: free films, no
# broadcast, none of your files) and gives it time to tune in.
# The first time, run docs/screenshots/antenne-sandbox --prepare before them:
# it takes the shows' pictures from the films.

[[scene]]
name = "antenne-guide"
doc = "docs/apps/antenne.md"
crop = "full"
modes = ["dark"]
# Page Up to the top of the guide, where the channels have programmes.
steps = ["run {repo}/docs/screenshots/antenne-sandbox", "wait 14", "key g", "wait 2",
         "key Prior", "key Prior", "key Prior", "key Prior", "key Prior", "key Prior",
         "key Prior", "key Prior", "key Prior", "key Prior", "wait 2"]

[[scene]]
name = "antenne-info"
doc = "docs/apps/antenne.md"
crop = "full"
modes = ["dark"]
steps = ["run {repo}/docs/screenshots/antenne-sandbox", "wait 14", "key space", "wait 1.5"]

[[scene]]
name = "antenne-shows"
doc = "docs/apps/antenne.md"
crop = "full"
modes = ["dark"]
# s opens the menu on Countries; Shows is the entry above it.
steps = ["run {repo}/docs/screenshots/antenne-sandbox", "wait 14", "key s", "wait 1", "key Up", "wait 0.4", "key Right", "wait 3"]

# ---- the controller ---------------------------------------------------------
# Manette ignores uinput pads, so the pad is made up in the bar (`ipc
# controller pad FAMILY BATTERY CHARGING`), with these games as its library.
# Their artwork is Steam's public one, downloaded into ~/.cache/pellicule.

[[settings.game]]
title = "The Witcher 3: Wild Hunt"
steam = 292030

[[settings.game]]
title = "Cyberpunk 2077"
steam = 1091500

[[settings.game]]
title = "ELDEN RING"
steam = 1245620

[[settings.game]]
title = "Red Dead Redemption 2"
steam = 1174180

[[settings.game]]
title = "Baldur's Gate 3"
steam = 1086940

[[settings.game]]
title = "Forza Horizon 5"
steam = 1551360

[[settings.game]]
title = "Hades II"
steam = 1145350

[[settings.game]]
title = "Assetto Corsa Competizione"
steam = 805550

[[scene]]
name = "controller-pill"
doc = "docs/tools/manette.md"
crop = [640, 800, 640, 400]
steps = ["ipc controller pad xbox 80 false", "wait 1"]
after = ["ipc controller reset", "wait 0.5"]

[[scene]]
name = "controller-menu"
doc = "docs/tools/manette.md"
crop = [320, 200, 1280, 800]
steps = [
    "ipc controller pad xbox 80 false",
    "ipc controller library {library}",
    "wait 3.5",
    "ipc bar controllerMenu",
    "wait 1.8",
]
after = ["ipc bar controllerMenu", "wait 0.5", "ipc controller reset", "wait 0.5"]

[[scene]]
name = "controller-menu-playstation"
doc = "docs/tools/manette.md"
crop = [320, 200, 1280, 800]
steps = [
    "ipc controller pad playstation 64 false",
    "ipc controller library {library}",
    "wait 3.5",
    "ipc bar controllerMenu",
    "wait 1.8",
]
after = ["ipc bar controllerMenu", "wait 0.5", "ipc controller reset", "wait 0.5"]

[[scene]]
name = "controller-apps"
doc = "docs/tools/manette.md"
crop = [320, 200, 1280, 800]
steps = [
    "ipc controller pad xbox 80 false",
    "ipc controller library {library}",
    "wait 3.5",
    "ipc bar controllerMenu",
    "wait 1.5",
    "ipc bar controllerNav y",
    "wait 1.2",
]
after = ["ipc bar controllerMenu", "wait 0.5", "ipc controller reset", "wait 0.5"]

[[scene]]
name = "bar-controller"
doc = "docs/tools/manette.md"
crop = [1440, 0, 480, 300]
# Once the arrival banner has gone.
steps = ["ipc controller pad xbox 80 false", "wait 3.5"]
after = ["ipc controller reset", "wait 0.5"]

[[scene]]
name = "bar-controller-charging"
doc = "docs/tools/manette.md"
crop = [1440, 0, 480, 300]
steps = ["ipc controller pad playstation 64 true", "wait 3.5"]
after = ["ipc controller reset", "wait 0.5"]

# ---- showcases ---------------------------------------------------------------
# Two screens in cascade on contour lines, drawn by showcase.html and
# rendered by Firefox at 2560x1600: NAME.webp here, NAME.png at full size in
# ~/.cache/pellicule/showcase. A screen is the first scene's whole screen
# with the others' crops laid on it; with `blank`, the empty desktop's
# scene, only what each adds to it.

[[showcase]]
name = "showcase"
doc = "README.md"
mode = "light"
back = ["controller-menu"]
front = ["calendar", "balise"]
blank = "bar"

[[showcase]]
name = "showcase-dark"
doc = "README.md"
mode = "dark"
back = ["controller-menu"]
front = ["calendar", "balise"]
blank = "bar"

# ---- videos -----------------------------------------------------------------
# scripts/pellicule --video NAME films the steps with wf-recorder, then
# writes NAME.webm here (the site) and, in `exports`, outside the repository:
# NAME-master.mp4, NAME-silent.mp4 (no music), NAME-16x9.mp4,
# NAME-square.mp4 and NAME-vertical.mp4 (social networks).
#
# `audio` is mixed in from the file itself, `audio_delay` seconds after the
# first frame; picture and sound fade out together over `fade` seconds.

[[video]]
name = "hero"
doc = "site/src/pages/index.astro"
mode = "light"
audio = "~/Musique/December Dream.mp3"
audio_delay = 0.4
fade = 2.5
exports = "~/Videos/coucou-shell"
steps = [
    # The music first: the island shows the track and its spectrum from
    # the first second to the last.
    "run mpv --no-video --really-quiet '~/Musique/December Dream.mp3'",
    "wait 4",
    # Roue: the power wheel, then away.
    "run ~/.local/bin/roue power", "wait 2.6",
    "key Escape", "wait 0.9",
    # The drawers on the right, then the calendar.
    "ipc bar toggleBalise", "wait 2.4",
    "ipc bar toggleBalise", "wait 0.8",
    "ipc bar toggleMixer", "wait 2.4",
    "ipc bar toggleMixer", "wait 0.8",
    "ipc bar toggleCalendar", "wait 2.2",
    "ipc bar toggleCalendar", "wait 0.8",
    # Two notifications arrive, then the centre.
    "notify Liseuse | Resuming | Plus courts chemins, page 12 of 48",
    "notify Prisme | Wallpapers ready | 3 fitted for 1920x1200", "wait 2.2",
    "ipc bar toggleNotificationCenter", "wait 2.6",
    "ipc bar closeNotificationCenter", "wait 0.9",
    # Super held: the key sheet, then its Shift layer.
    "ipc bar keybindsPress", "wait 2.2",
    "ipc bar keybindsShift true", "wait 1.4",
    "ipc bar keybindsShift false",
    "ipc bar keybindsRelease", "wait 0.9",
    # A controller arrives, its menu opens.
    "ipc controller library {library}",
    "ipc controller pad xbox 80 false", "wait 2.2",
    "ipc bar controllerMenu", "wait 1.4",
    "ipc bar controllerNav down", "wait 0.6",
    "ipc bar controllerNav right", "wait 0.6",
    "ipc bar controllerNav right", "wait 1.2",
    "ipc bar controllerMenu", "wait 0.6",
    "ipc controller reset", "wait 0.8",
    # The tiling: five terminals stacked then closed last first, then five
    # file windows the same way. Each terminal its own process.
    "run wezterm start --always-new-process", "wait 1.0",
    "run wezterm start --always-new-process", "wait 1.0",
    "run wezterm start --always-new-process", "wait 1.0",
    "run wezterm start --always-new-process", "wait 1.0",
    "run wezterm start --always-new-process", "wait 1.2",
    "wait 2.0",
    "close org.wezfurlong.wezterm last", "wait 0.8",
    "close org.wezfurlong.wezterm last", "wait 0.8",
    "close org.wezfurlong.wezterm last", "wait 0.8",
    "close org.wezfurlong.wezterm last", "wait 0.8",
    "close org.wezfurlong.wezterm last", "wait 1.0",
    "wait 1.0",
    # Prisme, from Plis to Soie: its light half, back to dark, applied;
    # then the light scheme brings Soie's light half.
    "run ~/.local/bin/prisme", "wait 2",
    "key Right", "wait 0.8",
    "key Right", "wait 1.4",
    "key c", "wait 1.4",
    "key c", "wait 1.2",
    "key Return", "wait 2.5",
    # Switch to dark for the end.
    "scheme dark", "wait 2.5",
    # In dark: the battery, then the desktop alone for the fade.
    "ipc bar togglePower", "wait 2.4",
    "ipc bar togglePower", "wait 0.9",
    "wait 3.5",
]
