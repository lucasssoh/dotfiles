<!doctype html>
<!--
  The showcase picture, put together by scripts/pellicule: two screens in
  cascade, ?back=FILE at the top left and ?front=FILE over it at the bottom
  right, on contour lines in ?mode (light or dark). Rendered by Firefox at
  2560x1600.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  .board { position: absolute; inset: 0; container-type: inline-size; }
  .light { background:
    repeating-radial-gradient(circle at 30% 120%, transparent 0 2.2cqw, rgba(150, 120, 85, .16) 2.2cqw 2.32cqw),
    radial-gradient(120% 90% at 20% 0%, #f7f2ea 0%, #e8dfd1 55%, #d9cdbb 100%); }
  .dark { background:
    repeating-radial-gradient(circle at 30% 120%, transparent 0 2.2cqw, rgba(230, 200, 160, .07) 2.2cqw 2.32cqw),
    radial-gradient(120% 90% at 80% 0%, #3a352f 0%, #22201d 55%, #161513 100%); }
  .card { position: absolute; border-radius: 1.4cqw; overflow: hidden; background: #0d0d0e; padding: .5cqw;
          box-shadow: 0 0 0 .1cqw rgba(255, 255, 255, .1) inset, 0 3cqw 6cqw -1cqw rgba(20, 14, 8, .55); }
  .card img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 1cqw; }
  .back { left: 4%; top: 5%; width: 60%; }
  .front { right: 4%; bottom: 5%; width: 52%; }
</style>
</head>
<body>
<div class="board" id="board">
  <div class="card back"><img id="back" alt=""></div>
  <div class="card front"><img id="front" alt=""></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("board").classList.add(q.get("mode") === "dark" ? "dark" : "light");
  document.getElementById("back").src = q.get("back");
  document.getElementById("front").src = q.get("front");
</script>
</body>
</html>
