[main]
# Was "Iosevka NF" (monospace). fuzzel.ini can't @import a CSS file, so
# this is a hand-kept copy of the same UI font used by Quickshell/Roue/
# Prisme -- see config/theme/fonts.css (the real source of truth) and
# quickshell/bar/theme/Fonts.qml. Fontconfig fallback still covers any
# glyph Inter itself lacks (e.g. the prompt icon below), so dropping the
# Nerd Font here doesn't lose icon rendering.
font=Inter:size=12
dpi-aware=no
# Quoted: fuzzel trims trailing spaces off an unquoted value, which
# left this key empty and made fuzzel refuse to start ("key/value
# pair has no value").
prompt=""
terminal=wezterm start --
lines=8
# `min-lines` was here and is not a fuzzel option (1.14 errored on it
# at startup) -- the real one is `minimal-lines`, a boolean, and its
# default (no) is what `min-lines=0` was reaching for anyway, so it
# just goes away.
width=35
horizontal-pad=20
vertical-pad=10
inner-pad=4
icon-theme=Papirus-Dark
icons-enabled=no
show-actions=no

[colors]
# Same style as the low-battery alert (quickshell/bar/modules/
# BatteryAlert.qml) -- every value below is one of that card's own
# tokens, not a fresh pick. fuzzel has no CSS/GSK engine behind it
# (pixman rendering: one flat background, one flat border color, no
# gradients), so the card's two-stop body and its GlassRim edge
# highlight can't come across literally; each is collapsed to the
# nearest single color it can express.
#
# Card body is a gradient #1e2128 (top) -> #060608 (bottom); this is
# its per-channel midpoint. Alpha stays at ee -- fuzzel sits over the
# desktop as an overlay, where the alert card sits on its own layer.
background=030302ff
# titleLabel / "Not now" label color.
text=f2f2f7ff
# `accent`, the alert's non-critical platinum (#a8b4c4) -- the same
# desaturated blue-to-platinum token the rest of the bar uses.
match=a8b4c4ff
# iconTile's surface: the card's one RAISED element, so it's what a
# highlighted row should be wearing. The pills' #14161d hover fill was
# the other candidate and is too close to the background above to read
# as a selection on its own.
selection=1a1d2aff
# Primary pill's label -- pure white, a step up from `text` above, same
# as the alert lifts its action row over its body copy.
selection-text=ffffffff
# `accentLight` (#c3ccd8), the accent's own hover/emphasis tone.
selection-match=c3ccd8ff
# The pills' border, Qt.rgba(1, 1, 1, 0.18) -> white at 18% (0x2e).
# Replaces the earlier flat #8e8e93 silver: the alert doesn't tint its
# edges at all, it just lets a little white through.
border=ffffff05

[border]
# Pill border.width.
width=5
# card.radius.
radius=18
