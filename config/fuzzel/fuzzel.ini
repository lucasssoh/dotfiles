[main]
# Was "Iosevka NF" (monospace). fuzzel.ini can't @import a CSS file, so
# this is a hand-kept copy of the same UI font used by Quickshell/Roue/
# Prisme -- see config/theme/fonts.css (the real source of truth) and
# quickshell/bar/theme/Fonts.qml. Fontconfig fallback still covers any
# glyph Inter itself lacks (e.g. the prompt icon below), so dropping the
# Nerd Font here doesn't lose icon rendering.
font=Inter:size=12
dpi-aware=no
prompt=  
terminal=wezterm start --
lines=8
min-lines=0
width=35
horizontal-pad=12
vertical-pad=8
inner-pad=4
icon-theme=Papirus-Dark
icons-enabled=no
show-actions=no

[colors]
background=1c1c1ecc
text=e5e5eaff
match=6b9fffff
selection=2c2c2eff
selection-text=e5e5eaff
selection-match=4fefffff
# Was 3a3a3c (the gradient's 75%-stop tone) -- fuzzel has no CSS/GSK
# engine behind it (pixman-based rendering, single flat border color, no
# gradient support), so it can't get the same "curved glass" treatment as
# Hyprland windows / Roue / Orbit / swaync (see roue/style.css's header
# comment). Closest approximation: a lighter, more silver tone (the
# gradient's 0%-25% stop range, #e5e5ea/#8e8e93) instead of the previous
# darker gray, evoking the same palette without pretending to be a real
# gradient.
border=8e8e93ff

[border]
width=1
radius=8
