[main]
font=Iosevka NF:size=12
dpi-aware=no
prompt=  
terminal=wezterm start --
lines=8
width=35
horizontal-pad=12
vertical-pad=8
inner-pad=4

[colors]
background=1c1c1eff
text=e5e5eaff
match=6b9fffff
selection=2c2c2eff
