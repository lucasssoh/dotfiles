[general]
import = [
    "~/.config/alacritty/themes/themes/{theme}.toml"
]

[window]
padding = { x = 12, y = 12 }
dynamic_title = true

# Opacity: 1.0 is opaque, 0.0 is invisible.
# 0.85 to 0.90 is the sweet spot for seeing the blur behind it.
opacity = 0.85

# Lets the window manager blur the background
blur = true

[font]
# Using JetBrainsMono Nerd Font (very readable in bold)
normal = { family = "JetBrainsMono", style = "regular" }
bold = { family = "JetBrainsMono", style = "Bold" }

# Bumping the size up slightly also helps with the "Bold" rendering
size = 12

[cursor]
style = { shape = "Beam", blinking = "On" }

# Default colors
[colors.primary]
background = '#000000'
foreground = '#ffffff'

[colors.cursor]
text = '#F81CE5'
cursor = '#ffffff'

# Normal colors
[colors.normal]
black   = '#000000'
red     = '#fe0100'
green   = '#33ff00'
yellow  = '#feff00'
blue    = '#0066ff'
magenta = '#cc00ff'
cyan    = '#00ffff'
white   = '#d0d0d0'

# Bright colors
[colors.bright]
black   = '#808080'
red     = '#fe0100'
green   = '#33ff00'
yellow  = '#feff00'
blue    = '#0066ff'
magenta = '#cc00ff'
cyan    = '#00ffff'
white   = '#FFFFFF'
