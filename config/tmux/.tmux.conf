# ============================================================
# FINAL CONFIGURATION - TMUX
# ============================================================

# --- TERMINAL AND COLORS ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm' # Underline support
set -g xterm-keys on
set -s extended-keys on
# Clipboard & paste fix
set -g set-clipboard on
set -g allow-passthrough on
set -as terminal-features ',*:paste'
set -as terminal-features ',*:clipboard'

# --- PANE BORDER STYLE (SOLID LINES) ---
# 'heavy' forces thick solid lines.
# 'single' would give solid but thin lines.
set -g pane-border-lines single
set -g pane-border-style "fg=#484e54"
set -g pane-active-border-style "fg=#ffb400"

# Focus effect (active vs inactive)
set -g window-style "fg=#a8a8a2,bg=default"
set -g window-active-style "fg=#f8f8f2,bg=default"

# --- GENERAL CONFIGURATION ---
set -g mouse on
set -s escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1

# --- KEYBOARD SHORTCUTS (ALT) ---

# Alt + v / Alt + s: Splits
bind -n M-s split-window -h -c "#{pane_current_path}"
bind -n M-v split-window -v -c "#{pane_current_path}"

# Alt + x: Close the current pane (NO CONFIRMATION)
bind -n M-x kill-pane

# Alt + hjkl: Navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# --- RESIZING (Prefix + hjkl) ---
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5

# --- STATUS BAR ---
set -g status-position top

set -g status-style "bg=default"
set -g status-left "#[fg=blue,bold]#S "
set -g status-right "#[fg=yellow]%H:%M #[fg=green]%d-%b"

# Remove the old default bindings to avoid conflicts
unbind '"'
unbind %

# ============================================================
# PLUGIN MANAGEMENT (TPM)
# ============================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# CONTINUUM IS REMOVED HERE

# tmux-resurrect configuration (optional but handy)
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# --- SAFETY: NO AUTO-RESTORE ---
# Make sure nothing launches on its own
set -g @continuum-restore 'off'

run '~/.tmux/plugins/tpm/tpm'

# TPM initialization (MUST STAY AT THE END)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
