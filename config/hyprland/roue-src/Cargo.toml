[package]
name = "roue"
version = "0.1.0"
edition = "2021"
description = "Native Wayland radial selection wheel (GTK4 + layer-shell), RPG weapon-menu style"
license = "MIT"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_14"] }
gtk4-layer-shell = "0.4"
resvg = "0.45.1"
serde = { version = "1", features = ["derive"] }
# Wheel definition format (wheels/*.toml) -- already the repo's convention
# for structured config (see orbit/theme.toml), better suited than a
# homemade key=value format for a list of sectors.
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true
