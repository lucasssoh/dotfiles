# ============================================================
# HYPRLOCK.CONF — Clean lock screen
# ============================================================

# grace, disable_loading_bar and no_fade_in used to sit here too. None of
# them is a config key anymore (hyprlock 0.9.6 only knows the ones below;
# grace moved to the --grace flag) and they were silently ignored -- which
# is why the idle lock never had a grace period. It is now passed by
# scripts/idle-action.sh, and only there.
general {
    hide_cursor = true
}

# Fond : noir pur. `path` vide fait tomber hyprlock sur `color` ; pas de
# wallpaper, donc plus rien a flouter (blur_passes = 0, sinon le blur
# tourne dans le vide) et brightness reste neutre.
background {
    monitor =
    path =
    color = rgba(0, 0, 0, 1.0)
    blur_passes = 0
}

# Time -- $TIME is hyprlock's own 24h clock, refreshed internally once a
# second. It replaced `cmd[update:1000] echo "$(date ...)"`, which forked a
# shell and date every second for as long as the screen stayed locked.
label {
    monitor =
    text = <b>$TIME</b>
    color = rgba(229, 229, 234, 1.0)
    font_size = 80
    font_family = SF Pro Display, MiSans Latin, sans-serif
    position = 0, 120
    halign = center
    valign = center
}

# Date -- LC_TIME forced to en_US like the bar's Clock.qml, otherwise
# date follows the system's fr_FR locale ("mercredi 23 septembre").
label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=en_US.UTF-8 date +'%A, %B %-d')"
    color = rgba(142, 142, 147, 1.0)
    font_size = 18
    font_family = SF Pro Text, MiSans Latin, sans-serif
    position = 0, 40
    halign = center
    valign = center
}

# Password field -- palette matches the rest of the "verre givré" pass
# (see quickshell/bar/shell.qml's header comment): outer_color is the SAME
# gradient string as hyprland.lua's general.col.active_border (white
# highlight -> platinum accent #a8b4c4 -> white highlight, 45deg), so the
# border around the password field and the border around a focused window
# are literally the same visual language. check_color/fail_color updated
# from the old #6b9fff/#ff453a to the current accent/danger tokens
# (#a8b4c4/#ff6e6e). outline_thickness 1 -> 2 to match border_size in
# hyprland.lua's general block, and rounding 10 -> 16 for the same bigger,
# softer scale Balise moved to (balise/style.css) -- the notification
# center matched it too, back when it was swaync/style.css; now it's
# NotificationCenter.qml's own radius: 20.
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(FFFFFF59) rgba(A8B4C48C) rgba(FFFFFF26) 45deg
    inner_color = rgba(12, 12, 14, 0.8)
    font_color = rgba(229, 229, 234, 1.0)
    # The screensaver: with fade_on_empty the field is hidden until the
    # first key, so an untouched lock screen is only the clock and date.
    # fade_timeout is how long an EMPTY field stays up after the last key
    # before hiding again (default 2 s -- too quick to read "Incorrect").
    fade_on_empty = true
    fade_timeout = 10000
    # ## (not a typo): hyprlang treats a bare # as a comment start even
    # mid-line, so a literal # inside a value has to be escaped as ## --
    # a single # here truncated the rest of the line, breaking the markup
    # and showing the raw "<span ..." text instead of rendering it.
    # Confirmed live: "fixing" this to a single # was the actual bug.
    placeholder_text = <span foreground="##8e8e93">Password</span>
    hide_input = false
    rounding = 16
    check_color = rgba(168, 180, 196, 1.0)
    fail_color = rgba(255, 110, 110, 1.0)
    fail_text = <i>Incorrect</i>
    capslock_color = rgba(255, 214, 10, 1.0)
    position = 0, -80
    halign = center
    valign = center
}
