# ============================================================
# HYPRLOCK.CONF — « Inversion »
# ============================================================

# grace, disable_loading_bar and no_fade_in used to sit here too. None of
# them is a config key anymore (hyprlock 0.9.6 only knows the ones below;
# grace moved to the --grace flag) and they were silently ignored -- which
# is why the idle lock never had a grace period. It is now passed by
# scripts/idle-action.sh, and only there.
general {
    hide_cursor = true
}

# Fond : noir pur. `path` vide fait tomber hyprlock sur `color` ; pas de
# wallpaper, donc plus rien a flouter (blur_passes = 0, sinon le blur
# tourne dans le vide) et brightness reste neutre.
background {
    monitor =
    path =
    color = rgba(0, 0, 0, 1.0)
    blur_passes = 0
}

# The "Inversion" layout (picked from five mockups, 2026-09-29): the time
# cut out in black from a white pill -- the shell's own "on" language, the
# bar's active workspace and a lit drawer tile -- and the only light thing
# on the screen. Colours are the drawers' palette
# (quickshell/bar/theme/DrawerTheme.qml): primary #f2f2f7, onInk #0c0c0e,
# secondary #8e8e93, muted #636366, card #17171a, danger #ff6e6e. No accent
# tint any more, the old platinum #a8b4c4 went with the HyperOS pass.
#
# Positions were laid out on the 1920x1200 panel, y counted up from the
# centre. Each font_size is the mockup's pixel size x 0.75, on the
# assumption that it is in points rendered at 96 dpi -- to be confirmed
# against the pill on a real lock.

# The pill. 600x250 like the mockup; centred 95px above the middle.
shape {
    monitor =
    size = 600, 250
    color = rgba(242, 242, 247, 1.0)
    rounding = 56
    border_size = 0
    position = 0, 95
    halign = center
    valign = center
}

# Time -- $TIME is hyprlock's own 24h clock, refreshed internally once a
# second. It replaced `cmd[update:1000] echo "$(date ...)"`, which forked a
# shell and date every second for as long as the screen stayed locked.
# Drawn in onInk ON the pill, same centre. 168px.
label {
    monitor =
    text = $TIME
    color = rgba(12, 12, 14, 1.0)
    font_size = 126
    font_family = MiSans Latin Demibold
    position = 0, 95
    halign = center
    valign = center
}

# Date -- LC_TIME forced to en_US like the bar's Clock.qml, otherwise
# date follows the system's fr_FR locale ("mercredi 23 septembre"). 26px.
label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=en_US.UTF-8 date +'%A, %B %-d')"
    color = rgba(142, 142, 147, 1.0)
    font_size = 20
    font_family = MiSans Latin
    position = 0, -84
    halign = center
    valign = center
}

# Password field -- a card-grey pill with plain dots, no border at rest:
# outer_color is the fill's own colour, so the 2px outline only shows when
# it changes -- white while PAM checks, red on a wrong password, yellow
# with caps lock on.
input-field {
    monitor =
    size = 380, 56
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 1.0
    dots_center = true
    outer_color = rgba(23, 23, 26, 1.0)
    inner_color = rgba(23, 23, 26, 1.0)
    font_color = rgba(242, 242, 247, 1.0)
    font_family = MiSans Latin
    # The screensaver: with fade_on_empty the field is hidden until the
    # first key, so an untouched lock screen is only the pill and the date.
    # fade_timeout is how long an EMPTY field stays up after the last key
    # before hiding again (default 2 s -- too quick to read "Incorrect").
    fade_on_empty = true
    fade_timeout = 10000
    # ## (not a typo): hyprlang treats a bare # as a comment start even
    # mid-line, so a literal # inside a value has to be escaped as ## --
    # a single # here truncated the rest of the line, breaking the markup
    # and showing the raw "<span ..." text instead of rendering it.
    # Confirmed live: "fixing" this to a single # was the actual bug.
    placeholder_text = <span foreground="##8e8e93">Password</span>
    hide_input = false
    rounding = -1
    check_color = rgba(242, 242, 247, 1.0)
    fail_color = rgba(255, 110, 110, 1.0)
    fail_text = <span foreground="##ff6e6e">Incorrect</span>
    capslock_color = rgba(255, 214, 10, 1.0)
    position = 0, -188
    halign = center
    valign = center
}

# Battery, and " · Wi-Fi" while the wireless link is up -- read straight
# from sysfs, no nmcli. Once a minute is plenty for a lock screen. 20px.
label {
    monitor =
    # No $ in here on purpose: hyprlock expands its own $VARIABLES in a
    # label's text before the shell ever sees it.
    text = cmd[update:60000] tr -d '\n' < /sys/class/power_supply/BAT0/capacity; printf '%%'; grep -qs up /sys/class/net/wl*/operstate && printf ' · Wi-Fi'; echo
    color = rgba(99, 99, 102, 1.0)
    font_size = 15
    font_family = MiSans Latin
    position = 0, 60
    halign = center
    valign = bottom
}
