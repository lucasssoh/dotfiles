# ============================================================
# HYPRIDLE.CONF — Idle ladders
# ============================================================
# Every listener goes through scripts/idle-action.sh rather than calling
# its tool directly, and every rung declares which power source it belongs
# to with `--on ac` or `--on battery`. hypridle itself has no notion of a
# power source, or of which machine it is running on -- a listener either
# fires or it doesn't -- and that is exactly why this daemon spent so long
# disabled: docked to an external monitor, on mains, all day, a 5-minute
# lock and a 30-minute suspend are pure annoyance.
#
# So BOTH ladders live here at once and each rung no-ops when the machine
# is on the other power source. hypridle fires all of them on time; the
# wrapper drops the ones that do not apply. The alternative -- generating
# this file per power state and restarting the daemon whenever a cable
# moves -- buys nothing and adds a daemon restart to a hot path.
#
# The wrapper also decides whether this MACHINE idles at all, from
# hosts/<machine>.env (see scripts/host-profile.sh). On the development
# desktop the answer is no, by name, so the daemon below still runs there
# and does nothing -- which is deliberate: hypridle is also what provides
# `before_sleep_cmd`, so leaving it running keeps a manual `systemctl
# suspend` locking the session even on a machine that never idles.
#
# ignore_dbus_inhibit stays false on purpose: mpv, Firefox and Steam all
# take a systemd inhibitor while playing, so video does not get locked
# out from under you. That is a correctness property, not a preference --
# do not "simplify" it to true.
# ============================================================

general {
    lock_cmd = pidof hyprlock || hyprlock   # prevent multiple instances
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = ~/.config/hypr/scripts/idle-action.sh dpms-on
    ignore_dbus_inhibit = false
}

# ============================================================
# ON BATTERY — the tight ladder
# ============================================================
# Unplugged, every minute of a lit panel costs real runtime, so the rungs
# come early and end in a suspend.

# 2m30 → dim screen
listener {
    timeout = 150
    on-timeout = ~/.config/hypr/scripts/idle-action.sh dim --on battery
    on-resume  = ~/.config/hypr/scripts/idle-action.sh undim
}

# 5m → lock
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/idle-action.sh lock --on battery
}

# 5m30 → turn off displays
# The largest single saving on a 14" laptop: the panel and its backlight
# dominate idle draw, well ahead of anything the compositor does.
listener {
    timeout = 330
    on-timeout = ~/.config/hypr/scripts/idle-action.sh dpms-off --on battery
    on-resume  = ~/.config/hypr/scripts/idle-action.sh dpms-on
}

# 30m → suspend system
listener {
    timeout = 1800
    on-timeout = ~/.config/hypr/scripts/idle-action.sh suspend --on battery
}

# ============================================================
# ON MAINS — the relaxed ladder
# ============================================================
# Plugged in, the point is no longer runtime, it is that a session left
# open is a session anyone can walk up to. So: lock, then drop the panel
# (still the biggest idle draw there is, and a lit lock screen for hours
# is just wear), and stop there.
#
# No dim rung: dimming is a warning that the lock is coming, and at this
# timeout it would only be a screen going murky in the middle of reading
# something.
#
# No suspend rung, deliberately. A plugged-in machine that suspends itself
# kills whatever was running in the background -- a build, a download, a
# sync -- and makes itself unreachable. Add "suspend --on ac" here if that
# ever becomes what you want; nothing else has to change.

# 15m → lock
listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/idle-action.sh lock --on ac
}

# 16m → turn off displays
listener {
    timeout = 960
    on-timeout = ~/.config/hypr/scripts/idle-action.sh dpms-off --on ac
    on-resume  = ~/.config/hypr/scripts/idle-action.sh dpms-on
}
