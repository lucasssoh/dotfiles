# ============================================================
# HYPRIDLE.CONF — Idle / power saving for laptop
# ============================================================
# Every listener goes through scripts/idle-action.sh rather than calling
# its tool directly. hypridle has no notion of power source -- a listener
# either fires or it doesn't -- and that is exactly why this daemon spent
# so long disabled in hyprland.lua: docked to the external monitor, on
# mains, all day, a 5-minute lock and a 30-minute suspend are pure
# annoyance. The timings below were already written and correct; only the
# "should this fire right now" question was missing.
#
# idle-action.sh answers it: on mains it is a no-op (which reproduces the
# old disabled behaviour exactly), on battery the full ladder runs. The
# policy is the RUN_ON_AC line in that script, nothing here.
#
# ignore_dbus_inhibit stays false on purpose: mpv, Firefox and Steam all
# take a systemd inhibitor while playing, so video does not get locked
# out from under you. That is a correctness property, not a preference --
# do not "simplify" it to true.
# ============================================================

general {
    lock_cmd = pidof hyprlock || hyprlock   # prevent multiple instances
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = ~/.config/hypr/scripts/idle-action.sh dpms-on
    ignore_dbus_inhibit = false
}

# 2m30 → dim screen
listener {
    timeout = 150
    on-timeout = ~/.config/hypr/scripts/idle-action.sh dim
    on-resume  = ~/.config/hypr/scripts/idle-action.sh undim
}

# 5m → lock
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/idle-action.sh lock
}

# 5m30 → turn off displays
# The largest single saving on a 14" laptop: the panel and its backlight
# dominate idle draw, well ahead of anything the compositor does.
listener {
    timeout = 330
    on-timeout = ~/.config/hypr/scripts/idle-action.sh dpms-off
    on-resume  = ~/.config/hypr/scripts/idle-action.sh dpms-on
}

# 30m → suspend system
listener {
    timeout = 1800
    on-timeout = ~/.config/hypr/scripts/idle-action.sh suspend
}
