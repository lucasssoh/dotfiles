[package]
name = "antenne"
version = "0.1.2"
edition = "2021"
description = "TV player for free channels: iptv-org catalogue, health checks, libmpv in GTK4"
license = "GPL-3.0-or-later"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_14"] }
libmpv2 = "4"
libmpv2-sys = "4"
libloading = "0.8"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
flate2 = "1"
quick-xml = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[profile.release]
opt-level = 3
lto = true
strip = true
