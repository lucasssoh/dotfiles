[package]
name = "prisme"
version = "0.1.0"
edition = "2021"
description = "Native Wayland wallpaper picker (parallelogram cards)"
license = "MIT"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_14"] }
gtk4-layer-shell = "0.4"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Thumbnail decoding/resizing happens on a thread -- gdk::Texture is a
# GObject (!Send), can't be built off the main thread; we decode to raw
# pixels here instead (Send), gtk4::gdk (re-exported by gtk4, no need for a
# separate dependency) only wraps those bytes into a MemoryTexture on the
# GTK thread afterwards.
# Pinned below 0.25.10: that version bumps the MSRV to 1.88 (we're on 1.85 here).
image = { version = ">=0.25, <0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# JPEG XL decoding (GNOME's default wallpapers ship as .jxl) -- pure Rust,
# no external `magick`/`djxl` process per image, consistent with the rest
# of this crate's "stay in memory" decoding. Pinned to 0.11: 0.12 pulls in
# jxl-bitstream 1.x, which uses let-chains (needs rustc 1.88+, we're on
# 1.85 here -- same reason `image` above is capped below 0.25.10).
jxl-oxide = "0.11"

[profile.release]
opt-level = 3
lto = true
strip = true
