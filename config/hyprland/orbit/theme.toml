# Orbit — palette, matching the quickshell bar's "verre givré" pass (see
# quickshell/bar/shell.qml's header comment): the old neon #4fefff/#4f9eff
# duo is gone, one platinum-desaturated accent everywhere instead, the SAME
# token the bar and the Hyprland active-border gradient both use.

accent_primary   = "#a8b4c4"  # was #4fefff -- active tab, "connected" borders, switch
accent_secondary = "#a8b4c4"  # was #4f9eff -- section headers (no more 2-tone accent)
background       = "#0c0c0e"  # was #141414 -- matches the bar's deepened black
foreground       = "#f2f2f7"  # text (unchanged, same token the bar uses)
destructive      = "#ff6e6e"  # was #ff453a -- matches the bar's danger red
opacity           = 0.97       # was 0.90, and 1.0 before that -- the compositor
                                # blur behind the panel is gone now (removed on
                                # request, see hypr/windowrules.lua), so the 10%
                                # transparency at 0.90 stopped reading as "glass"
                                # and started reading as a visible, unblurred hint
                                # of whatever's behind -- most obvious in the
                                # Bluetooth/VPN tabs, whose content is shorter than
                                # the stack's forced minimum height (see
                                # stack.set_size_request in window.rs), leaving a
                                # patch of near-empty panel where that bleed-
                                # through has nothing else layered over it to hide
                                # under. 0.97 keeps a hint of "glass" without it
                                # being legible as a second background.
