# Orbit — position/margins/transitions
# (colors -> theme.toml, font -> style.css, in this same folder)

# Top-right corner, like the swaync notification center -- same "floating
# panel" visual language for every system popup.
position = "top-right"

# Same values as control-center-margin-* in swaync/config.json -- Hyprland
# already automatically offsets surfaces anchored to the top to clear the
# area reserved by waybar, so no need to add the bar's height ourselves
# (doing so gave a panel lower than swaync's).
margin_top = 8
margin_bottom = 8
margin_left = 8
margin_right = 8

window_transition = "slidedown"
window_transition_duration = 150

stack_transition = "slidehorizontal"
stack_transition_duration = 150
