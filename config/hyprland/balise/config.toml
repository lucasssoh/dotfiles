# Balise — position/margins/transitions
# (theme -> style.css, in this same folder)

# Top-right corner, same "floating panel" visual language as Orbit/swaync's
# notification center.
position = "top-right"

# Same values as Orbit's config.toml / swaync's control-center-margin-* --
# Hyprland already automatically offsets surfaces anchored to the top to
# clear the area reserved by the bar.
margin_top = 8
margin_bottom = 8
margin_left = 8
# 6, not 8: aligns the panel's right edge with the quickshell tools
# pill above it (its own anchors.rightMargin is 6).
margin_right = 6

# "slidedown" (a vertical slide) used to be here -- switched to a plain
# fade after confirming live that the slide closes unevenly: it visually
# translates the whole panel upward, so the header/list scroll off past
# the top well before the footer buttons do, reading as "the background
# takes forever to actually disappear" even though the whole animation
# is done in ~150-200ms either way. A crossfade fades every pixel at the
# same rate, so nothing lingers behind the rest.
window_transition = "crossfade"
window_transition_duration = 150

# Transition between the Bluetooth/WiFi/Ethernet tabs. They are siblings,
# not a sequence, so sliding them implied a left/right ordering that
# doesn't exist -- a plain crossfade instead (asked for). Note this does
# NOT govern the drill-in to an endpoint's detail page, which stays a
# directional slide because that one IS a sequence (list -> item); see
# ui/window.rs's show_detail/leave_detail.
stack_transition = "crossfade"
# Court volontairement : le fondu n'est la que pour eviter un changement
# net, pas pour se faire remarquer. Au-dela de ~150ms la bascule commence
# a se sentir molle.
stack_transition_duration = 120
