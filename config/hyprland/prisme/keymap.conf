# Prisme — mapping des touches. Rechargé à chaque lancement (pas de daemon
# Prisme, éditer ce fichier suffit, pas besoin de recompiler).
#
# Une ligne par action, plusieurs touches possibles séparées par des
# virgules. Noms de touches au format X11/GDK (gdk_keyval_from_name) :
# Escape, Return, KP_Enter, Left, Right, Up, Down, Tab, space, h, H, j, J,
# k, K, l, L, etc. Une touche ou une ligne invalide est juste ignorée (avec
# un message dans les logs), pas besoin que tout le fichier soit parfait.
#
# close       : ferme Prisme sans rien appliquer
# move_left   : carte précédente
# move_right  : carte suivante
# activate    : applique la carte au focus (Statique) / finalise la sélection (Diaporama)
# toggle_mode : bascule Statique <-> Diaporama
# select      : ajoute la carte au focus au diaporama (Diaporama seul)
# deselect    : retire la carte au focus du diaporama (Diaporama seul)

close = Escape
move_left = Left, h, H
move_right = Right, l, L
activate = Return, KP_Enter, space
toggle_mode = Tab
select = Down, j, J
deselect = Up, k, K
