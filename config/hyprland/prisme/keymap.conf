# Prisme — key mapping. Reloaded on every launch (no Prisme daemon, editing
# this file is enough, no need to recompile).
#
# One line per action, several keys allowed separated by commas. Key names
# in X11/GDK format (gdk_keyval_from_name): Escape, Return, KP_Enter, Left,
# Right, Up, Down, Tab, space, h, H, j, J, k, K, l, L, etc. An invalid key
# or line is just ignored (with a log message), no need for the whole file
# to be perfect.
#
# close       : closes Prisme without applying anything
# move_left   : previous card
# move_right  : next card
# activate    : applies the focused card (Static) / finalizes the selection (Slideshow)
# toggle_mode : switches Static <-> Slideshow
# select      : adds the focused card to the slideshow (Slideshow only)
# deselect    : removes the focused card from the slideshow (Slideshow only)

close = Escape
move_left = Left, h, H
move_right = Right, l, L
activate = Return, KP_Enter, space
toggle_mode = Tab
select = Down, j, J
deselect = Up, k, K
