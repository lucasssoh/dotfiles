# Prisme — dossier des wallpapers originaux (parcourus par le carrousel).
# Rechargé à chaque lancement (pas de daemon Prisme, éditer ce fichier
# suffit, pas besoin de recompiler). Même fichier lu par les scripts bash
# du dépôt (wallpaper-cache-watcher.sh, restore_wallpaper.sh,
# wallpaper-slideshow.sh, set_wallpaper.sh) : un seul dossier à changer
# ici pour que tout le pipeline (carrousel, cache "Filtered", diaporama,
# restauration au boot) suive.
#
# Une seule ligne active : chemin absolu, ou préfixé par `~/` (résolu vers
# $HOME). Fichier absent, vide, ou ne contenant que des commentaires ->
# repli sur ~/Images/Wallpapers.

~/Images/Wallpapers
