# Prisme — folder holding the original wallpapers (browsed by the
# carousel). Reloaded on every launch (no Prisme daemon, editing this file
# is enough, no need to recompile). Same file read by the repo's bash
# scripts (wallpaper-cache-watcher.sh, restore_wallpaper.sh,
# wallpaper-slideshow.sh, set_wallpaper.sh): a single folder to change here
# for the whole pipeline (carousel, "Filtered" cache, slideshow, boot
# restore) to follow.
#
# A single active line: absolute path, or prefixed with `~/` (resolved to
# $HOME). Missing, empty, or comments-only file -> falls back to
# ~/Images/Wallpapers.

~/Images/Wallpapers
