# Wallpapers listed here (by filename glob pattern, one `*` wildcard
# supported per line) use "fill" mode in wallpaper-filter.rs: plain cover +
# center-crop, no blurred background, no safe axis protecting a subject
# from being cropped. Meant for abstract/pattern art and landscape photos,
# where cropping doesn't lose anything worth protecting.
#
# Everything NOT matched here keeps the default "safe" mode (never crops
# the axis carrying the main subject) -- portraits, character art, or
# anything else where the whole subject must stay visible.
#
# Lines starting with # and blank lines are ignored.

gnome-*
macos-*
