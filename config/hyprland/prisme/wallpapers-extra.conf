# Extra wallpaper source folders, merged with this repo's own wallpapers/
# (the defaults) into WALL_DIR (see wallpapers.conf) -- read by
# set_wallpapers.sh and wallpaper-cache-watcher.sh, the two scripts that
# build/maintain that merge. Typical use: a private, un-versioned-here
# repo holding the bulk of a personal wallpaper collection, kept separate
# from the public dotfiles repo.
#
# One folder per line, absolute path or prefixed with `~/` (resolved to
# $HOME). Lines starting with # and blank lines are ignored. A folder that
# doesn't exist on this machine is skipped silently (no error) -- so this
# file can list folders that only exist on some of your machines.
# Missing/empty file -> only the repo's own wallpapers/ is used.

~/code/wallpapers-private/wallpapers
