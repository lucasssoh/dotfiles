# "Power" wheel -- replaces waybar/scripts/rofi-power.sh. Same actions as
# that script; destructive sectors keep `confirm = true` to route through a
# Cancel/Confirm sub-menu before acting, with `confirm_accent = "red"` (see
# roue-src/src/config.rs) so Confirm turns red -- without it, it is the
# plain inversion, as on the display wheel. Icons: MingCute SVGs in
# roue/icons/, resolved from ~/.config/roue/icons/. Labels in English, like
# the rest of the shell.
title = "Power"

[[segment]]
icon = "lock.svg"
label = "Lock"
action = "hyprlock"

[[segment]]
icon = "moon.svg"
label = "Sleep"
action = "systemctl suspend"
confirm = true
confirm_accent = "red"

[[segment]]
icon = "bed.svg"
label = "Hibernate"
action = "systemctl hibernate"
confirm = true
confirm_accent = "red"

[[segment]]
icon = "log-out.svg"
label = "Log out"
action = "loginctl terminate-user $USER"
confirm = true
confirm_accent = "red"

[[segment]]
icon = "refresh-cw.svg"
label = "Restart"
action = "systemctl reboot"
confirm = true
confirm_accent = "red"

[[segment]]
icon = "power.svg"
label = "Shut down"
action = "systemctl poweroff"
confirm = true
confirm_accent = "red"
