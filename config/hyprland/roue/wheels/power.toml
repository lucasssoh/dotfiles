# "Power" wheel — replaces waybar/scripts/rofi-power.sh. Same actions as
# that script; destructive sectors keep `confirm = true` to route through a
# Confirm/Cancel sub-menu before acting (equivalent of confirm.rasi, on the
# same wheel), with an explicit `confirm_accent = "red"` (see
# roue-src/src/config.rs) -- without it this sub-menu would be cyan like
# any other (that's the default, see the wheels/display.toml generated by
# display-layout.sh: nothing there is as serious as a reboot/poweroff).
# Icons: Lucide/Tabler SVGs in roue/icons/ (rasterized natively, see
# roue-src/src/icons.rs), not Nerd Font glyphs -- files resolved from
# ~/.config/roue/icons/. Labels in English (see roue-src/src/main.rs): no
# system language detection, staying consistent with the rest of the repo
# rather than guessing.
title = "Power"

[[segment]]
icon = "lock.svg"
label = "Lock"
action = "hyprlock"

[[segment]]
icon = "moon.svg"
label = "Sleep"
action = "systemctl suspend"
confirm = true
confirm_accent = "red"

[[segment]]
icon = "bed.svg"
label = "Hibernate"
action = "systemctl hibernate"
confirm = true
confirm_accent = "red"

[[segment]]
icon = "log-out.svg"
label = "Log out"
action = "loginctl terminate-user $USER"
confirm = true
confirm_accent = "red"

[[segment]]
icon = "refresh-cw.svg"
label = "Restart"
action = "systemctl reboot"
confirm = true
confirm_accent = "red"

[[segment]]
icon = "power.svg"
label = "Shut down"
action = "systemctl poweroff"
confirm = true
confirm_accent = "red"
