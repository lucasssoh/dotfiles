# "Actions" wheel -- the hub. Bound to the Copilot key, which this machine's
# firmware sends as the fixed chord SUPER+SHIFT+F23 (see keybinds.lua for the
# libinput capture and why that bind has no `release` half).
#
# This wheel opens the OTHER wheels rather than doing anything itself, and
# gives them one key to remember instead of three awkward ones: power
# (SUPER+Delete), powerprofile (SUPER+SHIFT+Delete) and display (SUPER+O).
#
# Wheels only. Sound and Microphone sectors used to open roue's
# audio-output / audio-input device wheels; both were retired once
# quickshell's Mixer drawer covered them, and the hub no longer points at
# anything that is not a wheel.
#
# The three existing shortcuts stay as they are. Nothing here replaces them:
# a hub is one keystroke slower than a direct bind, which is the right trade
# for the wheels reached occasionally and the wrong one for muscle memory
# that already exists.
#
# Launching a wheel FROM a wheel works because roue derives its GApplication
# id from the wheel name -- `com.roue.<wheel_name>`, see roue-src/src/main.rs
# and its comment there. A `roue power` spawned by this wheel is a different
# app-id from the `com.roue.actions` still shutting down, so it builds its
# own UI instead of being routed into the outgoing instance the way
# `roue power --commit` deliberately is.
#
# Two sectors run a `roue-gen` first, exactly as the bar and keybinds.lua
# already do for these same wheels: powerprofile and display describe
# hardware state (which profile is applied, which outputs are connected),
# so their toml is rewritten on every press rather than kept in the repo.
# Only power.toml is static, hence the bare call in its sector.
#
# No sector is destructive -- the confirmations live one level down, inside
# power.toml -- so nothing here carries `confirm` or `accent`, and the
# default cyan applies throughout. No actions.css either: the per-wheel CSS
# layer is optional (theme.rs) and display.css/powerprofile.css are empty.
title = "Actions"

[[segment]]
icon = "power.svg"
label = "Power"
action = "$HOME/.local/bin/roue power"

[[segment]]
icon = "zap.svg"
label = "Profile"
action = "$HOME/.config/hypr/scripts/performance.sh roue-gen && $HOME/.local/bin/roue powerprofile"

[[segment]]
icon = "monitor.svg"
label = "Displays"
action = "$HOME/.config/hypr/scripts/display-layout.sh roue-gen && $HOME/.local/bin/roue display"
