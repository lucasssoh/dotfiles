# Roue "Profil d'énergie" — remplace waybar/scripts/rofi-performance.sh.
# Mêmes actions que waybar/scripts/performance.sh (qui affiche le profil
# actif dans waybar). `pkill -RTMIN+1 waybar` force ce module à se
# rafraîchir immédiatement après le changement, au lieu d'attendre son
# prochain interval (10s). Icônes : SVG Lucide dans roue/icons/, cf.
# power.toml.
title = "Profil d'énergie"

[[segment]]
icon = "zap.svg"
label = "Performance"
action = "powerprofilesctl set performance && pkill -RTMIN+1 waybar"

[[segment]]
icon = "scale.svg"
label = "Équilibré"
action = "powerprofilesctl set balanced && pkill -RTMIN+1 waybar"

[[segment]]
icon = "leaf.svg"
label = "Économie d'énergie"
action = "powerprofilesctl set power-saver && pkill -RTMIN+1 waybar"
