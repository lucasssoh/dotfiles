# GTK3 runtime settings -- the half of the Nemo restyle that CSS cannot do.
#
# Why this file is what makes Nemo stop being white: the session had
# `org.gnome.desktop.interface gtk-theme = 'Adwaita-dark'`, and there is no
# such GTK3 theme. `/usr/share/themes` holds no Adwaita at all on Fedora --
# GTK3 ships Adwaita compiled into libgtk-3 as a gresource, and that
# resource contains ONE theme named "Adwaita" plus a dark VARIANT selected
# by the boolean below, not a second theme named "Adwaita-dark". So the
# name resolved to nothing, GTK3 fell back to light Adwaita, and Nemo came
# up white while everything else on the desktop was dark.
#
# `color-scheme = 'prefer-dark'`, also already set in dconf, does not cover
# this either: that key is read by GTK4/libadwaita, and GTK3 predates it.
# `gtk-application-prefer-dark-theme` is GTK3's own switch and the only one
# it listens to.
#
# gtk.css next to this file is loaded on top of the dark variant this
# selects -- it repaints Adwaita in the bar's palette, it does not replace
# it, so this line has to stay for the two to agree on a starting point.
[Settings]
gtk-theme-name = Adwaita
gtk-application-prefer-dark-theme = 1

# Left out on purpose: gtk-font-name. The session already carries
# "MiSans Latin 11" in dconf (org.gnome.desktop.interface font-name), which
# is the same face config/hyprland/theme/fonts.css hands Roue/Prisme/Fuzzel
# and theme/Fonts.qml hands the bar. Restating it here would be a fourth
# copy to keep in sync for no gain, and the dconf value wins anyway.
