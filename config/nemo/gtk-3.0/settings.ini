# GTK3 runtime settings -- the fallback half of the theme choice.
#
# On this session GTK3 does not really read this file for the theme: with
# xdg-desktop-portal-gtk running, gtk-theme-name comes from
# org.gnome.desktop.interface gtk-theme through the portal, and the bar's
# appearance toggle (AppearanceState.qml) flips that key between
# "Adwaita-dark" (dark) and "Adwaita" (light). This file only answers when
# no portal does (a bare `dbus-run-session`, a TTY-started app).
#
# "Adwaita-dark" is a REAL theme here, not a typo for the dark variant:
# GTK3 has no built-in theme by that name (only "Adwaita" + a variant
# flag), so config/nemo/theme/build-adwaita-dark.py generates one in
# ~/.local/share/themes -- Adwaita's own dark sheet in the bar's palette.
# Before it existed, the name resolved to nothing and GTK3 fell back to
# LIGHT Adwaita under a dark-only user stylesheet; Nemo's properties
# dialog came out as white text on a white page.
#
# prefer-dark is 0 on purpose. The dark look is carried by the theme NAME
# now; left at 1 it would also turn "Adwaita" dark and the light position
# of the toggle would do nothing for GTK3.
[Settings]
gtk-theme-name = Adwaita-dark
gtk-application-prefer-dark-theme = 0

# Left out on purpose: gtk-font-name. The session already carries
# "MiSans Latin 11" in dconf (org.gnome.desktop.interface font-name), which
# is the same face config/hyprland/theme/fonts.css hands Roue/Prisme/Fuzzel
# and theme/Fonts.qml hands the bar. Restating it here would be a fourth
# copy to keep in sync for no gain, and the dconf value wins anyway.
