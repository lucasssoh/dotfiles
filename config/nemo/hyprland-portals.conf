# ~/.config/xdg-desktop-portal/hyprland-portals.conf — linked by config/nemo/install.sh.
#
# Which portal backend answers each interface in a Hyprland session.
#   hyprland: screenshots, screen sharing, global shortcuts.
#   gtk:      everything else -- the file chooser (GTK3, themed like Nemo) and
#             the light/dark setting the bar's appearance toggle writes.
# Same as the system default (/usr/share/xdg-desktop-portal/), but pinned per
# interface so a portal pulled in later by some app (kde, gnome) cannot take
# the file chooser or the colour scheme over.

[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Settings=gtk
