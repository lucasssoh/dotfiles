# config/brave/brave-flags.conf — the command-line flags Brave is launched
# with. Read by config/brave/install.sh, which injects them into a USER
# copy of Brave's .desktop file (~/.local/share/applications/).
#
# Why a .desktop override and not a flags file Brave reads itself: the
# Arch package's wrapper script reads ~/.config/brave-flags.conf. The
# OFFICIAL rpm does ship a wrapper too, but it is Chromium's stock one --
# it exports CHROME_WRAPPER, sanitises std{in,out,err}, execs "$HERE/brave"
# and reads no flags file of any kind (verified by reading it). So there
# is nowhere to drop flags. The .desktop copy is the one mechanism that
# works on Fedora, survives package upgrades (a user desktop entry shadows
# the system one), and still covers every launch path that matters here:
# fuzzel (SUPER+Space), nemo's "open with", and xdg-open from any app.
#
# One flag per line. Blank lines and # comments are ignored.

# Native Wayland instead of XWayland. Not just a scaling/font-crispness
# matter here: the colour-management protocol below is a WAYLAND protocol,
# so under XWayland there is no HDR path at all, whatever else is set.
--ozone-platform-hint=auto

# HDR. Hyprland advertises wp_color_manager_v1 (hyprctl systeminfo lists
# "hdr" as supported, and render:cm_enabled defaults to true on 0.56);
# this is the Chromium side of that same protocol, which is what lets
# YouTube see an HDR-capable display and offer the HDR formats at all.
#
# install.sh VERIFIES this string against the installed binary rather
# than trusting it: Chromium feature names get renamed between versions,
# a bad one is silently ignored (no error, no warning, HDR just never
# works), and finding that out from YouTube's stats-for-nerds hours later
# is the expensive way.
#
# Confirmed present in brave 1.x on this machine as the C++ identifier
# `kWaylandWpColorManagerV1`; the runtime name is that minus the leading
# "k", which is the convention Chromium's BASE_FEATURE macro follows and
# why the check accepts both spellings.
--enable-features=WaylandWpColorManagerV1
