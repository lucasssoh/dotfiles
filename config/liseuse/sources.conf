# Extra folders indexed by Liseuse, on top of ~/Livres (the library root
# proper, see the `liseuse` script's LIBRARY_ROOT).
#
# Same idea and same format as prisme/wallpapers-extra.conf: the point is
# to READ books where they already live rather than making a tidy library
# a precondition for using one. Course PDFs belong in ~/courses next to
# the rest of the course; they should still show up in the picker.
#
# One folder per line, absolute or prefixed with `~/` (resolved to
# $HOME). Lines starting with # and blank lines are ignored. A folder
# that doesn't exist on this machine is skipped silently, so this file
# can list folders that only exist on some of your machines. Hidden
# directories, node_modules/ and target/ are never descended into.
#
# Missing or empty file -> only ~/Livres is indexed.

~/courses
~/Downloads
~/Téléchargements
