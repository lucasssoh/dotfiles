# Wayland natif
# vo=gpu-next (libplacebo) plutôt que vo=gpu (legacy) : seul gpu-next parle
# le protocole wp_color_manager_v1 exposé par Hyprland, donc seul lui peut
# faire un vrai passthrough/tone-mapping HDR (HDR10, PQ) au lieu d'un rendu
# SDR poussé tel quel dans le pipeline HDR de l'écran (résultat terne).
vo=gpu-next
gpu-context=wayland
hwdec=auto

# Passthrough HDR réel : sans ça, target-colorspace-hint reste sur son mode
# par défaut ("target"), qui ne renvoie que les caractéristiques de l'écran
# courant au compositeur -- mpv tone-mappe alors le contenu HDR en interne
# AVANT de l'encoder en PQ, d'où un rendu plat même avec un vrai fichier HDR10
# et le pipeline wp_color_manager_v1 actif. "source" fait remonter les
# vraies métadonnées du contenu (mastering display, luminance) à Hyprland,
# qui peut alors adapter l'affichage à la place de mpv.
target-colorspace-hint=yes
target-colorspace-hint-mode=source

# Audio via pipewire
ao=pipewire

# Interface
border=no
keepaspect=yes
cursor-autohide=1000

# Sous-titres
sub-auto=fuzzy
slang=fr,en

# Qualité
scale=lanczos

# Sync audio/video
video-sync=display-resample
interpolation=yes
tscale=oversample

# Buffer pipewire
audio-buffer=0.1
audio-stream-silence=yes

# Correction de dérive
af=scaletempo2
