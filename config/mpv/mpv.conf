# Native Wayland
# vo=gpu-next (libplacebo) rather than vo=gpu (legacy): only gpu-next speaks
# the wp_color_manager_v1 protocol exposed by Hyprland, so only it can do
# real HDR passthrough/tone-mapping (HDR10, PQ) instead of SDR content
# pushed as-is into the screen's HDR pipeline (dull-looking result).
vo=gpu-next
gpu-context=wayland
hwdec=auto

# HDR passthrough: mpv's manual (--target-colorspace-hint-mode) is explicit
# about what each mode actually does -- "source" is the traditional
# passthrough mode: mpv forwards the FILE's own declared metadata as-is and
# assumes "the compositor and display will handle the colorspace directly",
# doing no tone-mapping of its own. "target" (mpv's real default) is the one
# that makes mpv itself tone-map using the DISPLAY's actual queried
# capabilities (real EDID peak, 1037 cd/m^2 on DP-9) before output.
#
# Confirmed empirically on 2026-07-28: with "source", a calibrated 0-1000
# nit HDR test pattern correctly ramped 0-200 nits, then flatlined --
# capped right around 203 cd/m^2 (Hyprland's fixed PQ reference-white
# constant) instead of reaching 1000. Switching to "target" makes mpv do
# its own tone-mapping against the real 1037-nit panel peak instead of
# trusting the compositor to expand a passthrough signal correctly.
target-colorspace-hint=yes
target-colorspace-hint-mode=target

# Audio via pipewire
ao=pipewire

# Interface
border=no
keepaspect=yes
cursor-autohide=1000

# Subtitles
sub-auto=fuzzy
slang=fr,en

# Quality
scale=lanczos

# Audio/video sync
video-sync=display-resample
interpolation=yes
tscale=oversample

# Pipewire buffer
audio-buffer=0.1
audio-stream-silence=yes

# Drift correction
af=scaletempo2
