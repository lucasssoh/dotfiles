# Native Wayland
# vo=gpu-next (libplacebo) rather than vo=gpu (legacy): only gpu-next speaks
# the wp_color_manager_v1 protocol exposed by Hyprland, so only it can do
# real HDR passthrough/tone-mapping (HDR10, PQ) instead of SDR content
# pushed as-is into the screen's HDR pipeline (dull-looking result).
vo=gpu-next
gpu-context=wayland
hwdec=auto

# Real HDR passthrough: without this, target-colorspace-hint stays on its
# default mode ("target"), which only reports the current screen's
# characteristics to the compositor -- mpv then tone-maps HDR content
# internally BEFORE encoding it to PQ, resulting in a flat picture even with
# a genuine HDR10 file and the wp_color_manager_v1 pipeline active. "source"
# forwards the content's real metadata (mastering display, luminance) to
# Hyprland instead, which can then adapt the display in mpv's place.
target-colorspace-hint=yes
target-colorspace-hint-mode=source

# Audio via pipewire
ao=pipewire

# Interface
border=no
keepaspect=yes
cursor-autohide=1000

# Subtitles
sub-auto=fuzzy
slang=fr,en

# Quality
scale=lanczos

# Audio/video sync
video-sync=display-resample
interpolation=yes
tscale=oversample

# Pipewire buffer
audio-buffer=0.1
audio-stream-silence=yes

# Drift correction
af=scaletempo2
