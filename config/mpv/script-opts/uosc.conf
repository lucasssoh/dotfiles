# uosc in the shell's colours (DrawerTheme). Only what differs from uosc's
# defaults; the full list ships with uosc (uosc.conf in its release).
# The text uses mpv's OSD font, sans-serif, which is MiSans here.
color=foreground=efece5,foreground_text=0c0c0e,background=000000,background_text=f2f2f7,window_border=000000,curtain=0b0b0d,success=a3d9a5,error=ff6e6e,match=efece5
border_radius=8
top_bar=no-border
