<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coucou — new tab</title>
<style>
  :root {
    --shell:#0b0b0d; --card:#17171a; --hover:#1f1f23; --raised:#2a2a2f;
    --ink:#f2f2f7; --dim:#8e8e93; --border:#3a3a3e; --faint:#48484a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:var(--shell); color:var(--ink);
    font:14px/1.5 system-ui, "Inter", sans-serif;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center;
    padding:40px 24px;
  }
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(60% 50% at 50% 0%, #17171a 0%, transparent 70%);
  }
  main { position:relative; display:flex; flex-direction:column; align-items:center;
         gap:30px; max-width:760px; width:100%; }

  .clock { text-align:center; }
  .clock .hh { font-size:52px; font-weight:650; letter-spacing:.01em; line-height:1; }
  .clock .dd { font-size:13px; color:var(--dim); margin-top:4px; }

  .tiles { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .tile {
    width:118px; padding:22px 14px 16px; border-radius:16px;
    background:var(--card); border:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; gap:12px;
    text-decoration:none; color:var(--ink);
    transition: transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .tile:hover { background:var(--hover); border-color:#5a5a60; transform:translateY(-2px); }
  .tile:focus-visible { outline:2px solid var(--dim); outline-offset:2px; }
  .tile .ico {
    width:40px; height:40px; border-radius:11px;
    background:var(--hover); display:flex; align-items:center; justify-content:center;
    overflow:hidden; box-shadow: inset 0 0 0 .5px #55555b;
  }
  .tile .ico img { width:22px; height:22px; object-fit:contain; }
  .tile .lbl { font-size:12px; color:var(--ink); }

  .used { width:100%; max-width:560px; display:flex; flex-direction:column; }
  .used .head {
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;
  }
  .used .head h2 {
    font-size:12px; font-weight:600; color:var(--dim);
    letter-spacing:.06em; text-transform:uppercase;
  }
  .used .head span { font-size:11px; color:var(--faint); }
  .used .rows {
    border:1px solid var(--border); border-radius:14px;
    background:var(--card); overflow:hidden;
    max-height:calc(100vh - 400px); min-height:0;
    overflow-y:auto;
  }
  .used .rows::-webkit-scrollbar { width:8px; }
  .used .rows::-webkit-scrollbar-thumb { background:var(--border); border-radius:8px; }
  .used a {
    display:flex; align-items:center; gap:12px; padding:9px 16px;
    text-decoration:none; color:var(--ink); font-size:13.5px;
    border-top:1px solid var(--border); transition:background .12s ease;
  }
  .used a:first-child { border-top:0; }
  .used a:hover { background:var(--hover); }
  .used a:focus-visible { outline:2px solid var(--dim); outline-offset:-2px; }
  .used a img { width:16px; height:16px; object-fit:contain; }
  .used a .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .used a .url {
    flex:0 0 auto; font-size:11.5px; color:var(--faint);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px;
  }
  .used .none { padding:14px 16px; font-size:12.5px; color:var(--faint); }

  @media (max-height:640px) {
    body { justify-content:flex-start; padding-top:24px; }
    main { gap:18px; }
  }
</style>
</head>
<body>
  <main>
    <div class="clock">
      <div class="hh" id="hh">--:--</div>
      <div class="dd" id="dd"></div>
    </div>

    <div class="tiles">
      <a class="tile" href="https://github.com/">
        <div class="ico"><img src="https://www.google.com/s2/favicons?domain=github.com&sz=64" alt=""></div>
        <div class="lbl">GitHub</div>
      </a>
      <a class="tile" href="https://www.youtube.com/">
        <div class="ico"><img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64" alt=""></div>
        <div class="lbl">YouTube</div>
      </a>
      <a class="tile" href="https://chatgpt.com/">
        <div class="ico"><img src="https://www.google.com/s2/favicons?domain=chatgpt.com&sz=64" alt=""></div>
        <div class="lbl">ChatGPT</div>
      </a>
      <a class="tile" href="https://gemini.google.com/">
        <div class="ico"><img src="https://www.google.com/s2/favicons?domain=gemini.google.com&sz=64" alt=""></div>
        <div class="lbl">Gemini</div>
      </a>
      <a class="tile" href="https://claude.ai/">
        <div class="ico"><img src="https://www.google.com/s2/favicons?domain=claude.ai&sz=64" alt=""></div>
        <div class="lbl">Claude</div>
      </a>
    </div>

    <section class="used">
      <div class="head"><h2>Most used</h2><span>from your browsing — re-run install to refresh</span></div>
      <div class="rows">
        <!--MOSTUSED-->
      </div>
    </section>
  </main>

  <script>
    const pad = (n) => String(n).padStart(2, "0");
    const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const months = ["January","February","March","April","May","June","July",
                    "August","September","October","November","December"];
    function tick() {
      const now = new Date();
      document.getElementById("hh").textContent =
        pad(now.getHours()) + ":" + pad(now.getMinutes());
      document.getElementById("dd").textContent =
        days[now.getDay()] + ", " + months[now.getMonth()] + " " + now.getDate();
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
