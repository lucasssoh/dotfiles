# ~/.config/environment.d/firefox.conf — linked here by config/firefox/install.sh.
#
# This file was referenced by install.sh but had never actually been
# committed, so every install left a dangling symlink in
# ~/.config/environment.d/ and systemd logged a warning for it.
#
# hypr/hyprland.lua already exports MOZ_ENABLE_WAYLAND for anything started
# from the Hyprland session. environment.d is the wider net: it covers
# processes started by systemd --user, by a different session (a KDE login,
# a TTY), or by a .desktop launcher that doesn't inherit the compositor's
# environment. Setting it in both places is intentional, not a duplicate.

# Native Wayland rather than XWayland: correct fractional scaling, correct
# per-monitor DPI, working touchpad gestures, no blurry text on a HiDPI
# panel.
MOZ_ENABLE_WAYLAND=1
