# The bar's equalizer: FOUR independent five-band chains, stereo, loaded
# into the pipewire daemon so they exist before anything can play into them
# and survive the bar being restarted.
#
# WHY FOUR AND NOT ONE. The equalizer is per application -- each row in the
# mixer drawer opens a page with its own curve and its own preset -- and two
# applications playing at once with different curves need two chains. A
# chain is a sink; a stream is in one sink or another; there is no way to
# apply two curves in one graph.
#
# WHY PRE-DECLARED AND NOT LOADED ON DEMAND. Creating one per application at
# the moment it is needed does work: `load-module libpipewire-module-filter-
# chain` typed into the resident pw-cli creates the sink, and -- measured --
# it is loaded into the DAEMON, so it outlives the pw-cli that asked for it.
# That is exactly the problem. Destroying one again needs `unload-module`,
# which takes a pw-cli *variable* naming the module, printed by the load and
# recoverable only by parsing pw-cli's own output back out of the pipe. Get
# that wrong, or restart the bar, and the chains accumulate in the daemon
# with nothing able to name them again -- a leak only a pipewire restart
# clears. Measured once by accident, with a test chain that was still there
# after the process that made it had exited.
#
# Four slots have none of that. They are always present, the bar assigns an
# application to a free one and releases it by moving the stream back out,
# and nothing is ever created or destroyed. Four because the question is how
# many things play at once, which is two or three; the drawer says so when
# they are all taken.
#
# WHAT THEY COST WHEN UNUSED: nothing. Measured with `pw-top`: a chain with
# no stream routed into it suspends and stops being scheduled entirely. Only
# the ones actually carrying audio appear in the graph at all.
#
# WHAT ONE COSTS WHEN USED. Measured, one stream through it, 1024-frame
# quantum at 48 kHz (21.3 ms of audio per quantum):
#
#   the ten biquads                       18-26 us
#   output stream + resampling            72-84 us
#
# ~0.5% of one core.
#
# WHY TEN NODES PER SLOT AND NOT ONE param_eq. `param_eq` chains biquads
# more efficiently and can load an AutoEQ file, but its curve lives in a
# `config` section, read once when the module loads. The individual bq_*
# filters expose "Freq", "Q" and "Gain" as control ports instead, and a
# control port can be written while the graph runs -- which is the whole
# requirement, since the curve is driven from a page with faders on it.
# Five bands times two channels is ten.
#
# The internal node names (eq_l_0 ... eq_r_4) are deliberately IDENTICAL in
# every slot: they are scoped to their own graph, so the bar writes the same
# parameter names whichever slot it is addressing and only the target node
# id changes. The slots differ solely by their sink name, eq_slot_0..3.
#
# Left and right are two independent chains fed from the two input ports and
# joined at the two outputs. They always carry the same values (the bar
# writes both in one command) -- the split is structural, not a stereo
# balance control.
#
# NAMING IS load-BEARING. services/MixerState.qml identifies everything that
# belongs to the equalizer by the `eq_slot_` / `eq_out_` prefixes, and uses
# that to keep them out of the output picker AND out of the "a new device
# was just connected" rule. Without it a chain is an Audio/Sink like any
# other: found during development when a test chain appeared and the bar
# promptly made it the default output, which means the equalizer feeding
# itself. Any new node added here must carry one of those two prefixes.
#
# HOW THE VALUES GET IN. services/MixerState.qml keeps ONE `pw-cli` alive for
# the session and writes lines into its stdin:
#
#   s <node-id> Props { params = [ "eq_l_0:Gain" 3.0 "eq_r_0:Gain" 3.0 ] }
#
# Measured at 83 us per write against 8 ms for a fresh `pw-cli` per write,
# and 0 ms of CPU while idle. See MixerState's own header for the one trap
# in that arrangement.
#
# THE BAND CENTRES. 60 / 250 / 1k / 4k / 12k, the classic five-band split: a
# shelf under the bass, three peaks across the midrange, a shelf over the
# treble. The two shelves are shelves and not peaks on purpose -- a peak at
# 60 Hz leaves everything below it untouched, so pulling it down would thin
# the kick drum and leave the rumble underneath.
#
# This file is generated in shape but edited by hand; if the band count or
# the slot count changes, MixerState.bandLabels and MixerState.slotCount
# have to change with it.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Equalizer 1"
      media.name       = "Equalizer 1"

      filter.graph = {
        nodes = [
            { type = builtin  name = eq_l_0  label = bq_lowshelf  control = { "Freq" = 60    "Q" = 0.70 "Gain" = 0.0 } }
            { type = builtin  name = eq_l_1  label = bq_peaking   control = { "Freq" = 250   "Q" = 1.00 "Gain" = 0.0 } }
            { type = builtin  name = eq_l_2  label = bq_peaking   control = { "Freq" = 1000  "Q" = 1.00 "Gain" = 0.0 } }
            { type = builtin  name = eq_l_3  label = bq_peaking   control = { "Freq" = 4000  "Q" = 1.00 "Gain" = 0.0 } }
            { type = builtin  name = eq_l_4  label = bq_highshelf control = { "Freq" = 12000 "Q" = 0.70 "Gain" = 0.0 } }

            { type = builtin  name = eq_r_0  label = bq_lowshelf  control = { "Freq" = 60    "Q" = 0.70 "Gain" = 0.0 } }
            { type = builtin  name = eq_r_1  label = bq_peaking   control = { "Freq" = 250   "Q" = 1.00 "Gain" = 0.0 } }
            { type = builtin  name = eq_r_2  label = bq_peaking   control = { "Freq" = 1000  "Q" = 1.00 "Gain" = 0.0 } }
            { type = builtin  name = eq_r_3  label = bq_peaking   control = { "Freq" = 4000  "Q" = 1.00 "Gain" = 0.0 } }
            { type = builtin  name = eq_r_4  label = bq_highshelf control = { "Freq" = 12000 "Q" = 0.70 "Gain" = 0.0 } }
        ]
        links = [
            { output = "eq_l_0:Out"  input = "eq_l_1:In" }
            { output = "eq_l_1:Out"  input = "eq_l_2:In" }
            { output = "eq_l_2:Out"  input = "eq_l_3:In" }
            { output = "eq_l_3:Out"  input = "eq_l_4:In" }

            { output = "eq_r_0:Out"  input = "eq_r_1:In" }
            { output = "eq_r_1:Out"  input = "eq_r_2:In" }
            { output = "eq_r_2:Out"  input = "eq_r_3:In" }
            { output = "eq_r_3:Out"  input = "eq_r_4:In" }
        ]
        inputs  = [ "eq_l_0:In"  "eq_r_0:In"  ]
        outputs = [ "eq_l_4:Out" "eq_r_4:Out" ]
      }

      capture.props = {
        node.name      = "eq_slot_0"
        media.class    = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
      }

      playback.props = {
        node.name      = "eq_out_0"
        # Passive: a chain must never keep a device awake on its own.
        # Without it each of the four drives whatever sink it is linked to
        # for as long as it exists, so the speakers stay powered with
        # nothing playing through any of them.
        node.passive   = true
        audio.channels = 2
        audio.position = [ FL FR ]
      }
    }
  }
