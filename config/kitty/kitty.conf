# --- WINDOW ---
window_padding_width 0 0
# Removing window decorations for a cleaner look with Tmux
hide_window_decorations yes
#
# --- FONT ---
# font_family      JetBrainsMono Nerd Font
# bold_font        JetBrainsMono Nerd Font Bold
# italic_font      JetBrainsMono Nerd Font Italic
# bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_family      Iosevka Nerd Font Light
bold_font        Iosevka Nerd Font Medium
italic_font      Iosevka Nerd Font Light Italic
bold_italic_font Iosevka Nerd Font Medium Italic

# Iosevka is narrower, bump it to 12.0 or 13.0 if you find it too small
font_size        12.0
disable_ligatures never
text_composition_strategy legacy
macos_thinner_glyphs yes

# --- APPEARANCE ---
background_opacity 0.90
background_blur 1
dynamic_background_opacity yes

# --- WINDOW BORDERS ---
window_border_width 1pt
active_border_color #ffb400
inactive_border_color #484e54
# Optional: a bit of rounding to match the modern style
window_margin_width 2

# --- CURSOR ---
cursor_shape block
shell_integration no-cursor
cursor_trail 10
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# --- COLOR THEME (Humanoid Dark Base16) ---
foreground #f8f8f2
background #111011 
selection_foreground #f8f8f2
selection_background #484e54

# Black
color0 #232629
color8 #484e54
# Red
color1 #b0151a
color9 #b0151a
# Green
color2 #028902
color10 #028902
# Yellow
color3 #ffb400
color11 #ffb400
# Blue
color4 #0082c9
color12 #0082c9
# Magenta
color5 #6d61a1
color13 #6d61a1
# Cyan
color6 #008b8b
color14 #008b8b
# White
color7 #f8f8f2
color15 #fcfcf6

# --- SYSTEM SHORTCUTS ---
clear_all_shortcuts yes
# Keeping just the config reload shortcut
map ctrl+shift+f5 load_config_file
# For standard copy/paste
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
