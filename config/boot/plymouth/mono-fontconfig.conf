<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  /etc/fonts/conf.d/55-mono-font.conf, installed there by
  config/boot/plymouth/install.sh.

  (Written without the double hyphens this repo's comments normally use:
  XML forbids them inside a comment, and fontconfig refuses the whole
  file over one.)

  This is a SYSTEM-WIDE rule, not a user one, and it has to be: what it
  exists to steer runs as root, before anyone is logged in.

  The boot splash's status line asks for a font whose name contains
  "Mono". label-freetype, the only label plugin dracut puts in the
  initramfs, reads that and switches to its monospace slot:

      if (strstr (font, "Mono") || strstr (font, "mono"))
              font_path = find_default_monospace_font_path ();

  which is `fc-match -f %{file} monospace`, falling back to
  /usr/share/fonts/Plymouth-monospace.ttf. Inside the initramfs there is
  no fc-match, so the fallback is what gets used, and that path is a
  symlink plymouth-populate-initrd creates at dracut time from, again,
  `fc-match -f %{file} monospace` run as root.

  So the font in the splash is whatever root's fontconfig answers for
  "monospace" on the machine where dracut last ran. A user level rule
  (~/.config/fontconfig, the way config/fonts/70-ui-font.conf does it for
  sans-serif) cannot reach that, and an environment override passed to
  one dracut run would be undone by the next kernel update regenerating
  the initramfs on its own. System wide is the only placement that
  survives.

  NUMBERING IS THE WHOLE MECHANISM, AND IT RUNS BACKWARDS FROM THE
  OBVIOUS GUESS. A fontconfig edit with mode="prepend" inserts before the
  element the test MATCHED, not at the head of the family list. Every
  package rule tests the same generic "monospace", so they all insert just
  before it, and a rule that runs LATER therefore lands CLOSER to
  "monospace" and further from the head. The earliest rule wins.

  Measured, with FC_DEBUG=1 fc-match monospace, when this file was
  numbered 70:

      family: "Noto Sans Mono"(w) "DejaVu Sans Mono"(w)
              "JetBrains Mono NL"(w) "Adwaita Mono"(w) ...
              "JetBrains Mono"(w) "monospace"(s)
                └─ this rule, in last place, with no effect at all

  56-google-noto-sans-mono-vf.conf runs first and so sits at the head.
  Hence 55: after 50-user.conf, so this user's own fontconfig can still
  override it, and before 56, which is the one to beat.

  Note for whoever reads config/fonts/70-ui-font.conf next: its rule does
  win, but not for the reason its comment gives. Per-user files are pulled
  in by /etc/fonts/conf.d/50-user.conf, so the whole user block runs at
  position 50, ahead of every package rule. The 70 in that filename only
  orders it among the user's own files.

  Side effect, deliberately accepted: this changes the default monospace
  for everything on the machine that resolves the generic family through
  fontconfig, not only the splash. That is the intent. The terminal and
  the editor already name JetBrains Mono explicitly, so this makes the
  generic case agree with them instead of contradicting them.

  The binding stays weak (the default), for the reason spelled out at
  length in config/fonts/70-ui-font.conf: a strong binding outranks
  language coverage and would displace the CJK faces for `:lang=ja`
  monospace patterns.
-->
<fontconfig>
  <match target="pattern">
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend">
      <string>JetBrains Mono</string>
    </edit>
  </match>
</fontconfig>
