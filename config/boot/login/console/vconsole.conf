# /etc/vconsole.conf
#
# KEYMAP is the safety-critical line in this file, and it nearly was not
# applied at all. systemd-vconsole-setup configures the font and the
# keymap together, and when setfont fails it logs
#
#     Configuration of first virtual console failed, ignoring remaining ones
#
# and gives up on BOTH. setfont fails on every early attempt here because
# Plymouth holds VT1 in KD_GRAPHICS mode, and a font cannot be written to
# a console in graphics mode. On a boot where Plymouth released the VT
# just before the greeter started, the last retry happened to succeed and
# the keymap landed in time; on a boot where it did not, the greeter came
# up in the kernel default layout, which is US QWERTY.
#
# That is not a cosmetic failure: it is a French keyboard typing a
# password it cannot see, in a layout where the punctuation has moved.
#
# So the keymap no longer depends on this file alone reaching the kernel
# in time. console-setup-late.service re-applies it after Plymouth has
# quit, keymap first, and cannot fail. This file stays the single place
# the values are written.
KEYMAP="fr-oss"
FONT="jetbrains-mono-8x16"
