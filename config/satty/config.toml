# satty, the screenshot editor (Super + S, Super + Shift + S, and `e` in
# swayimg). Linked to ~/.config/satty/config.toml by the bar unit.

[general]
# Copying hands the image to wl-copy, which stays in the background and keeps
# serving it once satty has quit. Without it satty copies through GTK, whose
# clipboard belongs to satty itself: Esc, and the image was gone.
copy-command = "wl-copy"
# Screenshot to the rest of the system: Hyprland's window rules and the q
# bind match this id. coucou-shell's satty build has it built in; set here
# too so any satty gets it.
app-id = "io.github.lucasssoh.Screenshot"
title = "Screenshot"

[font]
family = "MiSans Latin"
style = "Semibold"

# The swatches of the bottom toolbar. overrides.css paints them as dots in
# this order: change one, change the other.
[color-palette]
palette = [
    "#ff453aff",
    "#ffb454ff",
    "#8ecae6ff",
    "#1c1c1eff",
    "#f2f2f7ff",
]
