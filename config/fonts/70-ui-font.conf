<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ~/.config/fontconfig/conf.d/70-ui-font.conf, symlinked here by
  config/fonts/install.sh.

  The desktop-wide half of the UI font choice. config/hyprland/theme/
  fonts.css and its hand-kept copies name "MiSans Latin" explicitly for
  the four apps we write ourselves; this file is how everything we do
  NOT write picks it up too: Firefox and Brave for any page that asks
  for a generic sans (or for system-ui, which falls through to
  sans-serif), plus every toolkit widget whose font resolves through
  fontconfig rather than through a settings key.

  Three details that are easy to get wrong.

  A raw <match> with <edit mode="prepend"> is not the same thing as
  <alias><prefer>, and only the former wins here. Fedora ships
  /etc/fonts/conf.d/63-rsms-inter.conf, which prefers Inter for
  sans-serif through <alias><prefer>: that inserts Inter immediately
  BEFORE the family it matched, so the list ends up as [Noto Sans, Inter,
  sans-serif] and Inter never gets to the front. An <edit mode="prepend">
  goes to the head of the whole list instead. That is why `fc-match
  sans-serif` answered "Noto Sans" on this machine despite that Inter
  rule sitting right there, and it is why 57-google-noto-sans.conf, the
  rule that was actually winning, is written the way this one is.

  The binding stays WEAK (the default), deliberately. A strong binding
  makes the family outrank language coverage, and MiSans Latin then wins
  even for a `:lang=ja` pattern, displacing Noto Sans CJK JP as the
  primary face for Japanese text. Verified both ways with
  `fc-match ":lang=ja"` before settling on weak: weak still puts MiSans
  first for sans-serif, sans-serif:lang=fr and system-ui, while ja/zh
  keep resolving to Noto Sans CJK exactly as before.

  The 70- prefix puts this after every distro rule that touches Latin
  sans-serif (60-latin, 63-rsms-inter, 69-nonlatin). Rules run in
  filename order and each prepend lands in front of the previous one, so
  being late is what puts MiSans at the head of the list.

  Deliberately NOT aliased: Helvetica and Arial keep their existing
  metric-compatible substitutes (Nimbus Sans / Liberation Sans). A page
  that names those wants those widths, and swapping MiSans in would
  reflow it.

  MiSans Latin covers Latin, Greek and Cyrillic only. Anything outside
  that (CJK above all) falls through to the distro's Noto chain
  untouched, which is the intended behaviour and not a gap.
-->
<fontconfig>
  <match target="pattern">
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend">
      <string>MiSans Latin</string>
    </edit>
  </match>

  <!-- So a bare `MiSans Latin` request still falls back through the
       generic sans chain for the scripts it does not cover. -->
  <alias>
    <family>MiSans Latin</family>
    <default>
      <family>sans-serif</family>
    </default>
  </alias>
</fontconfig>
